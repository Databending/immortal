[request_definition]
# sub = subject (usr_*, sa_*, wk_*)
# dom = tenant/namespace
# obj = resource identifier (e.g. "workflow:wf_123", "queue:high", "run:run_789")
# act = action (e.g. "read", "start", "execute")
r = sub, dom, obj, act

[policy_definition]
# sub here is typically a role name, but it can also be a concrete subject if you want.
p = sub, dom, obj, act

[role_definition]
# RBAC with domains:
# g, user, role, domain
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# A request is allowed if:
# - the subject has the role in that domain, and
# - the policy matches the requested domain, object, action
#
# keyMatch2 supports patterns like "workflow:*" and "workflow:wf_123"
# You can also allow dom wildcard (like "*") if you want cross-tenant admins.
m = g(r.sub, p.sub, r.dom) && (p.dom == r.dom || p.dom == "*") && keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act)
