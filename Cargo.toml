# cargo.features = "all"

[package]
name = "immortal"
version = "0.1.0"
edition = "2021"
resolver="2"

[dependencies]
tonic = "0.13"
prost = "0.13"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0.98"
simd-json = {version="0.15.1"}
tracing = {version="0.1.41"}
tokio-util = {version="0.7.15"}
futures = {version="0.3.31"}
uuid = { version = "1.16.0", features = ["v4", "serde"]}
schemars = {version = "0.8.22", features=["uuid1"]}
# paste = {version="1.0.15"}
derive_builder = {version="0.20.2"}
chrono = {version = "0.4.41", features=["serde"]}
async-stream = {version="0.3"}
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
# server dependencies
tokio-stream = {version = "0.1",features=["sync"]}
prost-wkt = {version = "0.6"}
prost-wkt-types = {version="0.6"}
serde_json = {version="1.0"}
rand = {version="0.9"}
thiserror = { version = "2.0.12"}
# tonic-health = {version="0.13.0"}
prost-types = {version="0.13.5"}
axum = {version="0.8.4", features = ["macros"]}
socketioxide = { version = "0.16.2", features = ["state"]}
tower-http = { version = "0.6.2", features = ["cors"]}
bb8-redis = {version="0.22.0"}
redis = { version = "0.30", default-features = false, features = ["tokio-comp", "streams", "aio", "json", "script"]}
immortal-macros = { path = "immortal-macros" }
immortal-lib = { path = "immortal-lib" }
immortal-worker-lib = { path = "immortal-worker-lib" }
itertools = {version="0.14.0"}
const_format = {version="0.2.34"}
tower = {version="0.5.2"}
regex = {version="1.11.1"}
dotenvy = {version="0.15.7"}
console-subscriber = {version="0.4.1"}
o2o = { version = "0.5.4", features = ["o2o-macros"] }
strum = { version = "0.27.2", features=["derive"] }
garde = { version = "0.22.0" }
sysinfo = "0.36.1"
dashmap = "6.1.0"
cron = "0.15.0"
tokio-cron-scheduler = "0.14.0"
kube = {version = "1.1.0", features=["runtime", "derive"]}
k8s-openapi = { version = "0.25.0", features = ["latest"] }
paste = "1.0.15"
rmp-serde = "1.3.0"
sentry = { version = "0.46.0", features = ["tracing"] }
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = {version = "0.6", features = ["profiling"]}

[[bin]]
name = "server"
path = "src/server.rs"


#
[[bin]]
name = "worker"
path = "src/worker.rs"
